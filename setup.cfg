[flake8]
# Mirrors Archipelago's CI lint (.github/workflows/analyze-modified-files.yml):
# the hard gate is E9,F63,F7,F82 (syntax errors + undefined names); the soft
# pass uses these limits. 120 columns per Archipelago's docs/style.md.
max-line-length = 120
max-doc-length = 120
max-complexity = 14
exclude = .git,__pycache__,.venv,venv
